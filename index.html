<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <title>NEON SWARM</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#04060d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="NEON SWARM" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <link rel="stylesheet" href="css/style.css?v=33" />
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="safe"></div>
    <button id="install" type="button">⬇ INSTAL APP</button>
    <!-- Dialog kirim skor (leaderboard) - dikelola js/net/leaderboard.js -->
    <div id="lb" hidden>
      <form id="lb-form" autocomplete="off">
        <h2>KIRIM SKOR</h2>
        <p id="lb-info"></p>
        <input
          id="lb-name"
          type="text"
          maxlength="16"
          placeholder="Nama (maks 16 karakter)"
          enterkeyhint="send"
          autocapitalize="words"
          autocorrect="off"
          spellcheck="false"
          aria-label="Nama pemain"
        />
        <p id="lb-msg" role="status"></p>
        <div class="row">
          <button id="lb-send" type="submit">KIRIM</button>
          <button id="lb-cancel" type="button">BATAL</button>
        </div>
      </form>
    </div>
    <div id="rotate" role="alert">
      <div class="phone"></div>
      <p>Putar perangkat ke mode <b>landscape</b></p>
    </div>

    <!-- Urutan penting: semua file berbagi scope global. main.js harus terakhir. -->
